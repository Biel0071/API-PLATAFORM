<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Platform — Dashboard</title>
  <link rel="stylesheet" href="app.css?v=13" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <h1>API Platform</h1>
      <p class="muted">Painel administrativo</p>
      <label>Email ou usuário
        <input type="text" id="login-email" value="admin" required autocomplete="username" />
      </label>
      <label>Senha
        <span class="password-field">
          <input type="password" id="login-password" required autocomplete="current-password" />
          <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
        </span>
      </label>
      <button type="submit">Entrar</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <h2>API Platform</h2>
      <nav class="nav-groups">
        <a class="nav-primary" href="#/home"><span>▦</span> Overview</a>
        <a class="nav-primary" href="#/projects"><span>◫</span> Projects</a>
        <a class="nav-primary" href="#/providers"><span>✦</span> Providers</a>
        <a class="nav-primary" href="#/keys"><span>🔑</span> API Keys</a>
        <a class="nav-primary" href="#/playground"><span>⚡</span> Playground</a>
        <a class="nav-primary" href="#/mission"><span>🎯</span> Mission Viewer</a>
        <a class="nav-primary" href="#/logs"><span>≡</span> Logs</a>
        
        <section class="nav-group" data-group="system">
          <button class="nav-group-toggle"><span>⚙ System Status</span><b>⌄</b></button>
          <div class="nav-submenu">
            <a href="#/health">Health Check</a>
            <a href="#/metrics">Prometheus Metrics</a>
            <a href="#/icp">ICP Integration</a>
            <a href="#/runtime">Runtime Config</a>
          </div>
        </section>
        
        <section class="nav-group" data-group="admin">
          <button class="nav-group-toggle"><span>🛡️ Admin</span><b>⌄</b></button>
          <div class="nav-submenu">
            <a href="#/tenants">Tenants</a>
            <a href="#/users">Users</a>
            <a href="#/settings">Settings</a>
          </div>
        </section>

        <a class="nav-primary fenix-btn" href="#/fenix" style="margin-top:20px; background: rgba(59,130,246,0.1); border-left: 3px solid #3b82f6;"><span>🚀</span> FÊNIX Connect</a>
      </nav>
      <button id="logout" class="ghost">Sair</button>
    </aside>
    <main id="content"></main>
    <!-- Modal genérico para UI -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div id="modal-content" class="modal-card">
        <button id="modal-close" class="ghost modal-close-btn">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="app.js?v=12"></script>
</body>
</html>
