version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: api_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiplatform_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-apiplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api_platform_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: api_platform_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-apiplatform}:${POSTGRES_PASSWORD:-apiplatform_secret_pass}@postgres:5432/${POSTGRES_DB:-apiplatform}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-apiplatform_prod_jwt_secret}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL_DOCKER:-http://host.docker.internal:8188}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT_HOST:-3001}:3000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: api_platform_worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-apiplatform}:${POSTGRES_PASSWORD:-apiplatform_secret_pass}@postgres:5432/${POSTGRES_DB:-apiplatform}?schema=public
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL_DOCKER:-http://host.docker.internal:8188}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: api_platform_nginx
    restart: always
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  redis_data:
