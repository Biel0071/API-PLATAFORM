server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    proxy_http_version 1.1;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_buffering off;
    client_max_body_size 50m;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Healthcheck endpoint (o compose faz wget /health | grep status).
    # Sem isto o container fica eternamente unhealthy e entra em restart-loop.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~ (^|/)\.(?!well-known/) {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API Proxy (Acoplado ao backend)
    # Encaminha rotas administrativas e v1 direto para o container da API
    location /admin/ {
        proxy_pass http://api:3000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ {
        proxy_pass http://api:3000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE / streaming: disable response buffering and keep connection alive
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /docs/ {
        proxy_pass http://api:3000/docs/;
        proxy_set_header Host $host;
    }
    location = /docs { return 302 /docs/; }
    location = /metrics {
        proxy_pass http://api:3000/metrics;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://api:3000/ready;
    }
}
